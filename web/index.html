<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember — Offline AI Assistant</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23E8804C'/></svg>">
</head>
<body>
  <div class="app">

    <!-- ───────── Sidebar ───────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="logo">
          <span class="logo-mark"></span>
          <span class="logo-name">Ember</span>
        </div>
        <button class="icon-btn" id="btn-collapse" title="Collapse sidebar">⟨</button>
      </div>

      <button class="new-chat" id="btn-new">
        <span class="plus">+</span> New chat
      </button>

      <nav class="conv-list" id="conv-list"></nav>

      <div class="sidebar-foot">
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">checking…</span>
        </div>
        <div class="foot-btns">
          <button class="icon-btn" id="btn-theme" title="Toggle light/dark">◐</button>
          <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
        </div>
      </div>
    </aside>

    <!-- ───────── Main ───────── -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="btn-expand" title="Open sidebar" hidden>⟩</button>
        <select id="model-select" class="model-select" title="Model"></select>
        <label class="agent-toggle" title="Let the model read/write files and run commands in its workspace">
          <input type="checkbox" id="agent-mode">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">Agent mode</span>
        </label>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-mark"></div>
          <h1>Ember</h1>
          <p class="tagline">Your offline AI assistant — for code and everything else.</p>
          <div class="suggestions">
            <button class="chip" data-fill="Write a Python script that renames all files in a folder to lowercase.">Write a script</button>
            <button class="chip" data-fill="Explain how async/await works in JavaScript with a short example.">Explain a concept</button>
            <button class="chip" data-fill="Review this code for bugs:\n\n">Review my code</button>
            <button class="chip" data-fill="Help me plan a small project: ">Plan a project</button>
          </div>
          <p class="offline-note" id="offline-note" hidden>
            No local model runtime detected. Start <strong>Ollama</strong> or
            <strong>llama-server</strong>, then click the status dot to retry.
          </p>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message Ember…"></textarea>
          <button id="btn-send" class="send-btn" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.4 20.4 22 12 3.4 3.6 3.4 10l13 2-13 2z"/></svg>
          </button>
        </div>
        <div class="composer-hint">Runs 100% locally · Enter to send · Shift+Enter for a new line</div>
      </footer>
    </main>
  </div>

  <!-- ───────── Settings modal ───────── -->
  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="btn-close-settings">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Backend URL <small>("auto" probes Ollama, then llama.cpp)</small></span>
          <input type="text" id="set-backend" placeholder="auto">
        </label>
        <label class="field">
          <span>Default model</span>
          <input type="text" id="set-model" placeholder="e.g. qwen2.5-coder:14b">
        </label>
        <label class="field">
          <span>Temperature</span>
          <input type="number" id="set-temp" min="0" max="2" step="0.1">
        </label>
        <label class="field">
          <span>System prompt</span>
          <textarea id="set-system" rows="4"></textarea>
        </label>
        <div class="field">
          <span>Agent workspace</span>
          <code id="set-workspace" class="workspace-path"></code>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-primary" id="btn-save-settings">Save</button>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
