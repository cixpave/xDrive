<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- xDrive — offline AI terminal -->
  <rect x="6" y="6" width="116" height="116" rx="18" fill="#0B0B0D"/>
  <rect x="6" y="6" width="116" height="116" rx="18" fill="none" stroke="#E8804C" stroke-width="5"/>
  <!-- terminal title strip -->
  <line x1="6" y1="30" x2="122" y2="30" stroke="#26262B" stroke-width="3"/>
  <circle cx="20" cy="18" r="4" fill="#E8804C"/>
  <circle cx="34" cy="18" r="4" fill="#55534E"/>
  <circle cx="48" cy="18" r="4" fill="#55534E"/>
  <!-- x glyph (prompt) -->
  <g stroke="#E8804C" stroke-width="11" stroke-linecap="round">
    <line x1="36" y1="56" x2="66" y2="92"/>
    <line x1="66" y1="56" x2="36" y2="92"/>
  </g>
  <!-- block cursor -->
  <rect x="80" y="78" width="16" height="14" fill="#E8804C"/>
</svg>
